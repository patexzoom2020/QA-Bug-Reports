name: Bug Report
description: Створити звіт про баг
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Коротка назва дефекту
      placeholder: Напр. Кнопка "Зберегти" не реагує на клік
    validations:
      required: true

  - type: textarea
    id: preconditions
    attributes:
      label: Pre-conditions
      description: Передумови (що має бути відкрито/налаштовано до початку)
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Кроки відтворення
      value: |
        1.  
        2.  
        3.  
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Очікуваний результат
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Фактичний результат
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: ОС і браузер
      placeholder: "Windows 11 / Chrome 120"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Серйозність дефекту
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Пріоритет
      options:
        - Blocker
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: attachment
    attributes:
      label: Attachment
      description: Скріншот або логи (можна перетягнути файл прямо сюди)
    validations:
      required: false
